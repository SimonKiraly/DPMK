<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- `viewport-fit=cover` lets the app draw under the iPhone notch/home-indicator
         areas; react-native-safe-area-context then reads the resulting CSS
         env(safe-area-inset-*) values on web, so screens keep their normal insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <meta name="format-detection" content="telephone=no" />
    <title>%WEB_TITLE%</title>

    <!-- PWA manifest — name/icons/display/theme come from public/manifest.json. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari: "Add to Home Screen" + standalone launch + status bar. Safari
         ignores the manifest's `display`/icons for this, hence the separate tags. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MHD Košice" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      Extra containment on top of the reset above: the reset gives html/body/#root
      a HEIGHT but never an explicit WIDTH, and only `body` (not `html`) gets
      `overflow: hidden`. On iOS Safari that combination is not enough by itself
      to stop a single mispositioned element from widening the page — `html` is
      the element that actually needs the overflow rule for touch/rubber-band
      scrolling to respect it. This does not paper over any specific component's
      overflow (those are fixed at the source — see OnboardingScreen.tsx and the
      web tab bar); it is the same "content must not exceed the viewport" baseline
      every responsive site needs regardless.
    -->
    <style id="viewport-containment">
      html {
        width: 100%;
        overflow-x: hidden;
        box-sizing: border-box;
        /*
          The reset above gives `html` `height: 100%`, which resolves against the
          viewport (html is the root element) — correct, and it does track a
          later resize (confirmed: the tab bar stays flush with the bottom edge
          after a live viewport-height change). `100dvh` is still layered on top
          as the more precise, purpose-built unit for a mobile browser whose
          visible height changes as its own UI chrome (the address/tab bar) shows
          or hides — `100vh` traditionally assumes the browser chrome is hidden.
          Older engines simply never see this line and keep the `100%` above;
          modern ones (Safari 15.4+, every current iPhone) get the more accurate
          value. This only touches `html`; `body`/`#root` inherit it through
          their own existing `height: 100%`, so it is not duplicated per element.
        */
        height: 100dvh;
      }
      body {
        width: 100%;
        box-sizing: border-box;
      }
      #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
